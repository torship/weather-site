<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
           href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" 
     />
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false" >
            <button><i class="fa-solid fa-magnifying-glass-location"></i></button>

        </div>
         <div class="weather">
             <img src="https://cdn-icons-png.flaticon.com/128/3222/3222800.png" alt="">
             <h1 class="temp">22°c</h1>    
             <h2 class="city">new york</h2>
             <div class="details">
                <div class="col">
                  <img src="https://cdn-icons-png.freepik.com/512/9290/9290540.png" alt="">
                  <div>
                     <p class="humidity">50%</p>
                     <p>humidity</p>
                  </div>
                </div>
                <div class="col">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaZo1rEaJAaJumt2lpXUIBfnm7-CNI9uxLAw&s" alt="">
                    <div>
                       <p class="wind">15 km/h</p>
                       <p>wind speed</p>
                    </div>
                  </div>
            </div>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
